name: nammadaiva_dashboard
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  fluttertoast: ^8.2.6
  carousel_slider: ^5.1.1
  shared_preferences: ^2.5.3
  http: ^1.5.0
  focus_detector: ^2.0.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  excel: ^2.0.3
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  flutter_localizations:
    sdk: flutter
  video_player: ^2.10.1
  reorderable_grid_view: ^2.2.8
  path_provider: ^2.1.5
  video_thumbnail: ^0.5.6
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
# flutter_icons:
#   android: true
#   ios: true
#   image_path: assets/loginImage.png
flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/logo.png
flutter:
  uses-material-design: true
  generate: true   # <-- REQUIRED FOR gen-l10n TO WORK

  assets:
    - assets/loginImage.png
    - assets/temple.png
    - assets/donation.png
    - assets/onlineseva.png
    - assets/ritual.png
    - assets/sevaimg.png
    - assets/transaction.png
    - assets/wowtracker.png
    - assets/audit.png
    - assets/logout.png
    - assets/backbutton.png
    - assets/phone.png
    - assets/message.png
    - assets/map.png
    - assets/about.png
    - assets/event.png
    - assets/otpimage.png
    - assets/calendar.png
    - assets/uploadimg.png
    - assets/edit.png
    - assets/logo.png
    - assets/leftflower.png
    - assets/rightflower.png
    - assets/logo.png

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300

l10n:
  arb-dir: lib/l10n
  template-arb-file: intl_en.arb
  output-localization-file: app_localizations.dart
  untranslated-messages-file: untranslated.txt
